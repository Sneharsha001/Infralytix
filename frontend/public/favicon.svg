<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2" />

  <!-- Hexagonal Tech Nodes / Circuit Lattice -->
  <path d="M32 10 L48 19 L48 37 L32 46 L16 37 L16 19 Z" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.35" fill="none" />
  <circle cx="32" cy="10" r="2" fill="#06b6d4" />
  <circle cx="48" cy="19" r="2" fill="#8b5cf6" />
  <circle cx="48" cy="37" r="2" fill="#6366f1" />
  <circle cx="32" cy="46" r="2" fill="#06b6d4" />
  <circle cx="16" cy="37" r="2" fill="#8b5cf6" />
  <circle cx="16" cy="19" r="2" fill="#6366f1" />

  <!-- Core Brandmark "IX" -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-1">IX</text>
</svg>
